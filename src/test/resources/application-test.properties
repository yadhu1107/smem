spring.application.name=smart-food-expiry-system-test
server.port=-1

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable automated SQL script initialization in tests; Hibernate handles schema
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.expiry.default-warning-days=7
app.notifications.email.enabled=false
