<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Record Food Waste')}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('waste')}"></div>

    <div id="content-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="container-fluid p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-danger text-white py-3">
                            <h4 class="fw-bold mb-0"><i class="bi bi-trash3-fill me-2"></i> Record Food Waste / Disposal</h4>
                            <small class="opacity-75">Deducts inventory stock and computes financial shrinkage cost</small>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/waste/save}" method="post">
                                <div class="row g-3">
                                    <!-- Batch Selection -->
                                    <div class="col-12">
                                        <label for="batchId" class="form-label fw-semibold">Select Inventory Batch <span class="text-danger">*</span></label>
                                        <select class="form-select" id="batchId" name="batchId" required onchange="updateMaxQuantity()">
                                            <option value="">Select an Active Batch to Dispose</option>
                                            <option th:each="view : ${batches}"
                                                    th:value="${view.batch.id}"
                                                    th:text="${view.batch.product.name} + ' &bull; Batch: ' + ${view.batch.batchNumber} + ' &bull; Avail: ' + ${view.batch.quantity} + ' ' + ${view.batch.product.unit} + ' &bull; Expiry: ' + ${view.batch.expiryDate} + ' [' + ${view.statusDisplayName} + ']'"
                                                    th:attr="data-avail=${view.batch.quantity}, data-cost=${view.batch.costPerUnit}"
                                                    th:selected="${selectedBatch != null and selectedBatch.id == view.batch.id}">
                                                Batch Item
                                            </option>
                                        </select>
                                    </div>

                                    <!-- Quantity Discarded -->
                                    <div class="col-12 col-md-6">
                                        <label for="quantity" class="form-label fw-semibold">Quantity to Discard <span class="text-danger">*</span></label>
                                        <input type="number" min="1" class="form-control" id="quantity" name="quantity" placeholder="Units to dispose" required oninput="calculateLoss()">
                                        <small class="text-muted" id="availText">Must not exceed available stock.</small>
                                    </div>

                                    <!-- Waste Reason -->
                                    <div class="col-12 col-md-6">
                                        <label for="wasteReason" class="form-label fw-semibold">Reason for Disposal <span class="text-danger">*</span></label>
                                        <select class="form-select" id="wasteReason" name="wasteReason" required>
                                            <option value="">Select Reason</option>
                                            <option th:each="r : ${wasteReasons}" th:value="${r.name()}" th:text="${r.label}">Reason</option>
                                        </select>
                                    </div>

                                    <!-- Date of Disposal -->
                                    <div class="col-12 col-md-6">
                                        <label for="wasteDate" class="form-label fw-semibold">Disposal Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="wasteDate" name="wasteDate" th:value="${defaultDate}" required>
                                    </div>

                                    <!-- Estimated Cost Loss Preview -->
                                    <div class="col-12 col-md-6">
                                        <label class="form-label fw-semibold">Estimated Cost Loss</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="text" id="lossPreview" class="form-control bg-light text-danger fw-bold" readonly value="0.00">
                                        </div>
                                    </div>

                                    <!-- Notes -->
                                    <div class="col-12">
                                        <label for="notes" class="form-label fw-semibold">Disposal Notes & Method</label>
                                        <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="e.g. Composted, bio-waste collection bin, damaged during transport..."></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                    <a th:href="@{/waste}" class="btn btn-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-danger px-4 shadow-sm">
                                        <i class="bi bi-trash-fill me-1"></i> Confirm & Dispose Stock
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script>
    function updateMaxQuantity() {
        const select = document.getElementById('batchId');
        const selected = select.options[select.selectedIndex];
        if (selected && selected.getAttribute('data-avail')) {
            const avail = parseInt(selected.getAttribute('data-avail'));
            const qtyInput = document.getElementById('quantity');
            qtyInput.max = avail;
            document.getElementById('availText').innerText = 'Available in batch: ' + avail + ' units';
        }
        calculateLoss();
    }

    function calculateLoss() {
        const select = document.getElementById('batchId');
        const selected = select.options[select.selectedIndex];
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        if (selected && selected.getAttribute('data-cost')) {
            const cost = parseFloat(selected.getAttribute('data-cost')) || 0;
            const loss = (qty * cost).toFixed(2);
            document.getElementById('lossPreview').value = loss;
        } else {
            document.getElementById('lossPreview').value = '0.00';
        }
    }

    document.addEventListener('DOMContentLoaded', updateMaxQuantity);
</script>

</body>
</html>
