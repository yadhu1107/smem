<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Add New Batch')}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('batches')}"></div>

    <div id="content-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="container-fluid p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h4 class="fw-bold text-dark mb-0">Register Product Batch</h4>
                            <small class="text-muted">Inward new inventory lot with specific manufacture / expiry dates</small>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/batches/save}" method="post">
                                <div class="row g-3">
                                    <!-- Product Selection -->
                                    <div class="col-12">
                                        <label for="productId" class="form-label fw-semibold">Target Product <span class="text-danger">*</span></label>
                                        <select class="form-select" id="productId" name="productId" required onchange="updateProductPrices()">
                                            <option value="">Select a Product from Catalog</option>
                                            <option th:each="p : ${products}"
                                                    th:value="${p.id}"
                                                    th:text="${p.name} + ' (' + ${p.barcode} + ' - ' + ${p.category.name} + ')'"
                                                    th:attr="data-cost=${p.purchasePrice}, data-price=${p.sellingPrice}, data-unit=${p.unit}, data-barcode=${p.barcode}"
                                                    th:selected="${selectedProduct != null and selectedProduct.id == p.id}">
                                                Product Name
                                            </option>
                                        </select>
                                    </div>

                                    <!-- Batch Number -->
                                    <div class="col-12 col-md-6">
                                        <label for="batchNumber" class="form-label fw-semibold">Batch / Lot Number <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="batchNumber" name="batchNumber" placeholder="e.g. BAT-2026-101" required>
                                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="generateBatchNumber()">Auto</button>
                                        </div>
                                    </div>

                                    <!-- Quantity -->
                                    <div class="col-12 col-md-6">
                                        <label for="quantity" class="form-label fw-semibold">Inward Quantity <span class="text-danger">*</span></label>
                                        <input type="number" min="1" class="form-control" id="quantity" name="quantity" placeholder="e.g. 50" required>
                                    </div>

                                    <!-- Dates -->
                                    <div class="col-12 col-md-6">
                                        <label for="purchaseDate" class="form-label fw-semibold">Purchase / Inward Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="purchaseDate" name="purchaseDate" th:value="${defaultPurchaseDate}" required>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="expiryDate" class="form-label fw-semibold">Expiration Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="expiryDate" name="expiryDate" required>
                                        <small class="text-muted">Must be verified from physical item package.</small>
                                    </div>

                                    <!-- Cost & Selling Price -->
                                    <div class="col-12 col-md-6">
                                        <label for="costPerUnit" class="form-label fw-semibold">Unit Purchase Cost ($)</label>
                                        <input type="number" step="0.01" min="0" class="form-control" id="costPerUnit" name="costPerUnit" placeholder="0.00">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="sellingPricePerUnit" class="form-label fw-semibold">Unit Selling Price ($)</label>
                                        <input type="number" step="0.01" min="0" class="form-control" id="sellingPricePerUnit" name="sellingPricePerUnit" placeholder="0.00">
                                    </div>

                                    <!-- Supplier -->
                                    <div class="col-12 col-md-6">
                                        <label for="supplier" class="form-label fw-semibold">Supplier / Vendor</label>
                                        <input type="text" class="form-control" id="supplier" name="supplier" placeholder="e.g. Metro Wholesale, Fresh Farm Co.">
                                    </div>

                                    <!-- Notes -->
                                    <div class="col-12 col-md-6">
                                        <label for="notes" class="form-label fw-semibold">Notes / Storage Rack</label>
                                        <input type="text" class="form-control" id="notes" name="notes" placeholder="e.g. Shelf A-3, Chiller 2">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                    <a th:href="@{/batches}" class="btn btn-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-emerald px-4 shadow-sm">
                                        <i class="bi bi-check-lg me-1"></i> Register Batch
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script>
    function generateBatchNumber() {
        const d = new Date();
        const rand = Math.floor(100 + Math.random() * 900);
        document.getElementById('batchNumber').value = 'BAT-' + d.getFullYear() + (d.getMonth()+1).toString().padStart(2, '0') + '-' + rand;
    }

    function updateProductPrices() {
        const select = document.getElementById('productId');
        const selected = select.options[select.selectedIndex];
        if (selected && selected.getAttribute('data-cost')) {
            document.getElementById('costPerUnit').value = selected.getAttribute('data-cost');
            document.getElementById('sellingPricePerUnit').value = selected.getAttribute('data-price');
        }
    }

    document.addEventListener('DOMContentLoaded', updateProductPrices);
</script>

</body>
</html>
