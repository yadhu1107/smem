<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Access Denied')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm border-0 text-center p-5" style="max-width: 500px;">
    <div class="mb-3 text-danger">
        <i class="bi bi-shield-slash-fill display-1"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">Access Denied (403)</h3>
    <p class="text-muted mb-4">You do not have permission to access this protected area. Administrator privileges are required for reports and user management.</p>
    <div>
        <a th:href="@{/dashboard}" class="btn btn-emerald px-4">
            <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
        </a>
    </div>
</div>

</body>
</html>
