<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('User Management')}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('users')}"></div>

    <div id="content-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="container-fluid p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Header -->
            <div class="page-heading d-flex flex-wrap justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold text-dark mb-1">User & Staff Management</h3>
                    <p class="text-muted small mb-0">Control supermarket roles, employee credentials, and access permissions</p>
                </div>
                <div class="d-flex gap-2 mt-2 mt-md-0">
                    <a th:href="@{/users/new}" class="btn btn-emerald btn-sm shadow-sm">
                        <i class="bi bi-person-plus-fill me-1"></i> Add New User
                    </a>
                </div>
            </div>

            <section class="record-section">
                <div class="section-heading">
                    <div><h5 class="fw-bold text-dark mb-1"><i class="bi bi-people-fill text-primary me-2"></i>Authorized store users</h5>
                        <p class="text-muted small mb-0">Manage access and account status for your team.</p></div>
                    <span class="badge bg-light text-dark" th:text="${#lists.size(users)} + ' users'">0 users</span>
                </div>
                <div class="row g-3" th:if="${!#lists.isEmpty(users)}">
                    <div class="col-12 col-md-6 col-xl-4" th:each="u : ${users}">
                        <article class="card record-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
                                        <div><h6 class="fw-bold mb-1" th:text="${u.fullName}">Full Name</h6><span class="text-muted small" th:text="'@' + ${u.username}">@user</span></div>
                                    </div>
                                    <span th:if="${u.active}" class="badge bg-success-subtle text-success">Active</span>
                                    <span th:unless="${u.active}" class="badge bg-danger-subtle text-danger">Deactivated</span>
                                </div>
                                <div class="record-meta-grid">
                                    <div><span>Email</span><strong class="text-break" th:text="${u.email}">user@smartfood.com</strong></div>
                                    <div><span>Role</span><strong th:text="${u.role.name() == 'ROLE_ADMIN' ? 'Store Administrator' : 'Store Staff'}">Role</strong></div>
                                    <div><span>Joined</span><strong th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">Date</strong></div>
                                </div>
                                <form th:action="@{/users/toggle/{id}(id=${u.id})}" method="post" class="mt-3">
                                    <button th:if="${u.active}" type="submit" class="btn btn-sm btn-outline-warning w-100"><i class="bi bi-lock me-1"></i>Deactivate account</button>
                                    <button th:unless="${u.active}" type="submit" class="btn btn-sm btn-outline-success w-100"><i class="bi bi-unlock me-1"></i>Activate account</button>
                                </form>
                            </div>
                        </article>
                    </div>
                </div>
                <div class="empty-state" th:if="${#lists.isEmpty(users)}"><i class="bi bi-people text-muted"></i><strong>No users found</strong></div>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
