<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Food Expiry Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            background: linear-gradient(135deg, #064e3b 0%, #0f392b 40%, #166534 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .login-header {
            background: #f0fdf4;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
            border-bottom: 1px solid #dcfce7;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-shield-check fs-1"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Smart Food Expiry</h4>
        <p class="text-muted small mb-0">Supermarket & Grocery Inventory Portal</p>
    </div>

    <div class="p-4 p-md-5">
        <!-- Success/Error Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small mb-3">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${successMessage}">Logged out</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="usernameOrEmail" class="form-label small fw-bold text-secondary">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="usernameOrEmail" name="usernameOrEmail" placeholder="e.g. admin or staff" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-emerald w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Store
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <span class="text-muted small d-block mb-2">Demo Credentials:</span>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-sm btn-outline-success" onclick="fillCreds('admin', 'admin123')">
                    <strong>Admin</strong> (admin123)
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('staff', 'staff123')">
                    <strong>Staff</strong> (staff123)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('usernameOrEmail').value = u;
        document.getElementById('password').value = p;
    }
</script>

</body>
</html>
