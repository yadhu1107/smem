<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="sidebar(activeNav)" id="sidebar" class="d-flex flex-column flex-shrink-0">
    <div class="brand-header">
        <a th:href="@{/dashboard}" class="brand-title">
            <i class="bi bi-shield-check text-success fs-3"></i>
            <div>
                <div class="lh-1">Smart Food</div>
                <small class="text-white-50 fs-6 fw-normal">Expiry Manager</small>
            </div>
        </a>
    </div>

    <div class="sidebar-heading">Operations</div>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
            <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activeNav == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/products}" class="nav-link" th:classappend="${activeNav == 'products' ? 'active' : ''}">
                <i class="bi bi-box-seam-fill"></i>
                <span>Products</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/batches}" class="nav-link" th:classappend="${activeNav == 'batches' ? 'active' : ''}">
                <i class="bi bi-layers-fill"></i>
                <span>Batch Inventory</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/expiry/alerts}" class="nav-link" th:classappend="${activeNav == 'expiry-alerts' ? 'active' : ''}">
                <i class="bi bi-bell-fill text-warning"></i>
                <span>Expiry Alerts</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/expiry/fefo}" class="nav-link" th:classappend="${activeNav == 'fefo' ? 'active' : ''}">
                <i class="bi bi-arrow-repeat text-info"></i>
                <span>FEFO Rotation</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/barcode/demo}" class="nav-link" th:classappend="${activeNav == 'barcode-demo' ? 'active' : ''}">
                <i class="bi bi-upc-scan text-success"></i>
                <span>20 Demo Barcodes</span>
            </a>
        </li>

        <div class="sidebar-heading">Loss & Surplus</div>
        <li class="nav-item">
            <a th:href="@{/waste}" class="nav-link" th:classappend="${activeNav == 'waste' ? 'active' : ''}">
                <i class="bi bi-trash3-fill text-danger"></i>
                <span>Food Waste Log</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/donations}" class="nav-link" th:classappend="${activeNav == 'donations' ? 'active' : ''}">
                <i class="bi bi-heart-fill text-danger"></i>
                <span>Food Donations</span>
            </a>
        </li>

        <div class="sidebar-heading" sec:authorize="hasAuthority('ROLE_ADMIN')">Administration</div>
        <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
            <a th:href="@{/reports}" class="nav-link" th:classappend="${activeNav == 'reports' ? 'active' : ''}">
                <i class="bi bi-bar-chart-line-fill text-primary"></i>
                <span>Reports & Analytics</span>
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
            <a th:href="@{/users}" class="nav-link" th:classappend="${activeNav == 'users' ? 'active' : ''}">
                <i class="bi bi-people-fill"></i>
                <span>User Accounts</span>
            </a>
        </li>
    </ul>

    <div class="user-profile-section mt-auto">
        <div class="d-flex align-items-center">
            <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 36px; height: 36px; font-weight: 600;">
                <span sec:authentication="name">U</span>
            </div>
            <div class="overflow-hidden me-auto">
                <div class="text-white small fw-bold text-truncate" sec:authentication="name">User</div>
                <div class="text-white-50" style="font-size: 0.72rem;" sec:authorize="hasAuthority('ROLE_ADMIN')">Administrator</div>
                <div class="text-white-50" style="font-size: 0.72rem;" sec:authorize="hasAuthority('ROLE_STAFF')">Store Staff</div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-link text-white-50 text-decoration-none p-1" title="Sign Out">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </form>
        </div>
    </div>
</div>
</html>
