<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit ? 'Edit Product' : 'Add New Product'})}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>

    <div id="content-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="container-fluid p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h4 class="fw-bold text-dark mb-0" th:text="${isEdit ? 'Edit Product Details' : 'Register New Food Product'}">Product Form</h4>
                            <small class="text-muted">Enter product specifications and minimum stock alert thresholds</small>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/products/save}" th:object="${product}" method="post">
                                <div id="barcodeFormFillMessage" class="alert alert-success py-2 small" hidden></div>
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{active}">

                                <div class="row g-3">
                                    <!-- Product Name -->
                                    <div class="col-12 col-md-8">
                                        <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Organic Whole Milk 1L" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>

                                    <!-- Category -->
                                    <div class="col-12 col-md-4">
                                        <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{category.id}" required>
                                            <option value="">Select Category</option>
                                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name} + ' (' + ${cat.defaultWarningDays} + 'd warning)'">Category</option>
                                        </select>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                                    </div>

                                    <!-- Brand -->
                                    <div class="col-12 col-md-6">
                                        <label for="brand" class="form-label fw-semibold">Brand / Manufacturer <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{brand}" placeholder="e.g. Amul, Tropicana, Nestle" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                                    </div>

                                    <!-- Barcode with inline scan button -->
                                    <div class="col-12 col-md-6">
                                        <label for="barcode" class="form-label fw-semibold">Barcode / UPC / EAN <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="text" id="barcode" class="form-control" th:field="*{barcode}" placeholder="e.g. 890126201001" required>
                                            <button type="button" class="btn btn-outline-emerald" data-bs-toggle="modal" data-bs-target="#barcodeScannerModal" title="Scan with USB or Camera">
                                                <i class="bi bi-upc-scan"></i> Scan
                                            </button>
                                        </div>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></div>
                                    </div>

                                    <!-- Unit & Min Stock Quantity -->
                                    <div class="col-12 col-md-6">
                                        <label for="unit" class="form-label fw-semibold">Unit of Measure <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{unit}" required>
                                            <option value="pcs">Pieces (pcs)</option>
                                            <option value="pack">Pack</option>
                                            <option value="box">Box</option>
                                            <option value="liters">Liters (L)</option>
                                            <option value="kg">Kilograms (kg)</option>
                                            <option value="grams">Grams (g)</option>
                                            <option value="bottles">Bottles</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="minStockQuantity" class="form-label fw-semibold">Low-Stock Warning Threshold <span class="text-danger">*</span></label>
                                        <input type="number" min="0" class="form-control" th:field="*{minStockQuantity}" placeholder="e.g. 10" required>
                                        <small class="text-muted">Triggers low-stock alert when valid shelf stock falls below this quantity.</small>
                                    </div>

                                    <!-- Prices -->
                                    <div class="col-12 col-md-6">
                                        <label for="purchasePrice" class="form-label fw-semibold">Default Purchase Price ($)</label>
                                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{purchasePrice}" placeholder="0.00">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="sellingPrice" class="form-label fw-semibold">Selling Price ($)</label>
                                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{sellingPrice}" placeholder="0.00">
                                    </div>

                                    <!-- Description -->
                                    <div class="col-12">
                                        <label for="description" class="form-label fw-semibold">Description / Storage Guidelines</label>
                                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Optional notes, refrigeration instructions, allergen info..."></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                    <a th:href="@{/products}" class="btn btn-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-emerald px-4 shadow-sm">
                                        <i class="bi bi-check-lg me-1"></i> <span th:text="${isEdit ? 'Update Product' : 'Save Product'}">Save</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<div th:replace="~{fragments/barcode-modal :: barcodeModal}"></div>

</body>
</html>
