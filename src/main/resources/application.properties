# ===================================================================
# Smart Food Expiry Management System - Application Configuration
# ===================================================================
spring.application.name=smart-food-expiry-system

# Server Port
server.port=8080

# -------------------------------------------------------------------
# Local database configuration (persistent H2 file)
# Embedded H2 starts without a separate service and preserves inventory on restart.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/food_expiry_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
# 'update' creates missing tables & columns safely without dropping existing data
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Expiry & System Settings
# -------------------------------------------------------------------
app.expiry.default-warning-days=7

# Email Notifications Configuration (Optional SMTP)
app.notifications.email.enabled=${EMAIL_ALERTS_ENABLED:false}
app.notifications.email.to=${ALERT_EMAIL_TO:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduled Expiry Checks (daily at 06:00 AM)
app.scheduling.expiry-check-cron=0 0 6 * * *
